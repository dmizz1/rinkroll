name: Grade grit (preview, not in the game yet)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats-update
  cancel-in-progress: false

jobs:
  grit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Grade grit
        run: node tools/grit.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_grit.txt
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Grit grades: $(date -u +'%B %-d, %Y')" && git pull --rebase origin main && git push; fi
