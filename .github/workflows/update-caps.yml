name: Update cap hits

on:
  workflow_dispatch: {}   # run by hand from the Actions tab when contracts change

permissions:
  contents: write

concurrency:
  group: stats-update
  cancel-in-progress: false

jobs:
  caps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull cap hits from PuckPedia
        run: node tools/update-caps.mjs
      - name: Rebuild the site
        run: python3 build.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data_cap.txt netlify
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update cap hits: $(date -u +'%B %-d, %Y')"
            git push
          fi
