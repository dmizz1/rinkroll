name: Probe cap sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          mkdir out
          curl -s -A "$UA" -L --max-time 30 https://capwages.com/teams/edmonton_oilers -o out/edm.html
          curl -s -A "$UA" -L --max-time 30 https://capwages.com/teams/utah_mammoth -o out/uta.html
          curl -s -A "$UA" -L --max-time 30 https://capwages.com/teams/st_louis_blues -o out/stl.html
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: out
