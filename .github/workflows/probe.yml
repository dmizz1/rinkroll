name: Probe stats sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'rinkroll'}), timeout=30); return json.load(r)
              except Exception as e: return {'ERR': str(e)}
          base = 'https://api.nhle.com/stats/rest/en/skater/'
          q = '?limit=3&cayenneExp=seasonId=20252026%20and%20gameTypeId=2'
          for rep in ['realtime', 'shottype', 'scoringpergame', 'summary', 'percentages', 'puckPossessions', 'scoringRates']:
              d = get(base + rep + q)
              rec = (d.get('data') or [{}])[0] if isinstance(d, dict) else {}
              print('PROBE', rep, 'total', d.get('total'), 'keys', sorted(rec.keys())[:80] if rec else d)
          e = get('https://api-web.nhle.com/v1/edge/skater-detail/8478420/20252026/2')
          print('PROBE edge keys', sorted(e.keys()))
          print('PROBE sogDetails', json.dumps(e.get('sogDetails'))[:900])
          z = get('https://api-web.nhle.com/v1/edge/skater-zone-time/8478420/20252026/2')
          print('PROBE zone-time', json.dumps(z)[:500])
          PY
