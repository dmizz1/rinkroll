name: Probe cap sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -s -A "$UA" -L --max-time 30 https://capwages.com/teams/edmonton_oilers -o edm.html
          python3 - <<'PY'
          import re
          h=open('edm.html',encoding='utf-8',errors='ignore').read()
          print('PROBE len',len(h))
          print('PROBE has __NEXT_DATA__', '__NEXT_DATA__' in h, '| self.__next_f', 'self.__next_f' in h)
          print('PROBE seasons', sorted(set(re.findall(r'20\d\d-\d\d', h)))[:20])
          i=h.find('McDavid')
          txt=re.sub(r'<[^>]+>',' | ',h[i-3000:i+3000]); txt=re.sub(r'(\s*\|\s*)+',' | ',txt)
          print('PROBE around', txt[:4000].replace('\n',' '))
          print('PROBE player links', re.findall(r'href="(/players/[^"]+)"', h)[:5])
          PY
