name: Probe cap sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -s -A "$UA" -L --max-time 30 https://capwages.com/teams/edmonton_oilers -o edm.html
          python3 - <<'PY'
          import re, json
          h=open('edm.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', h, re.S)
          d=json.loads(m.group(1))
          paths=[]
          def walk(o,p):
              if isinstance(o,dict):
                  for k,v in o.items(): walk(v,p+[k])
              elif isinstance(o,list):
                  for i,v in enumerate(o[:400]): walk(v,p+[i])
              elif isinstance(o,str) and 'McDavid' in o: paths.append(p)
          walk(d,[])
          print('PROBE paths', paths[:6])
          p=paths[0]
          node=d
          for k in p[:-1]: node=node[k]
          print('PROBE node', json.dumps(node)[:2500])
          # parent list size
          parent=d
          for k in p[:-2]: parent=parent[k]
          print('PROBE parent type', type(parent).__name__, len(parent) if hasattr(parent,'__len__') else '')
          PY
