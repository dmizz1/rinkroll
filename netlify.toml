# Netlify serves the pre-built site in /netlify and the leaderboard API from /functions.
[build]
  publish = "netlify"
  command = ""

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
