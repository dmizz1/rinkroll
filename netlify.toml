# Netlify serves the pre-built site in /netlify and the leaderboard API from /functions.
[build]
  publish = "netlify"
  command = ""

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# public profiles: rinkroll.app/u/<name> opens the game page, which shows that player's profile
[[redirects]]
  from = "/u/*"
  to = "/index.html"
  status = 200
